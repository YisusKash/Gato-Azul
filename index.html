<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gato Azul | Tatuajes y arte en tinta</title>
<meta name="description" content="Daniela, tatuadora. Arte corporal, billetes personalizados, arte sobre huesos e ilustraciones de animales.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0b101a; --deep:#121a2a; --line:#222f47; --mist:#d3dbe8; --dim:#8996ad; --blue:#6f93ff;
  --serif:'Instrument Serif',Georgia,serif; --sans:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--mist);font:400 1rem/1.65 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 1.5rem}
section{padding:6rem 0}
h1,h2,h3{font-family:var(--serif);font-weight:400;line-height:1.05;color:#fff}
h2{font-size:clamp(2rem,5vw,3.2rem);margin-bottom:2.5rem}
p{max-width:60ch}

/* barra superior */
header{padding:1.4rem 0}
header .wrap{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.logo{font-family:var(--serif);font-size:1.5rem;text-decoration:none;color:#fff}
nav{display:flex;gap:1.5rem;font-size:.92rem;color:var(--dim)}
nav a{text-decoration:none;transition:color .2s}
nav a:hover{color:#fff}

/* inicio */
.hero{padding:2rem 0 5rem;min-height:calc(100svh - 80px);display:flex;align-items:center}
.hero .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:3rem;align-items:center}
.hero h1{font-size:clamp(2.8rem,8vw,6rem);letter-spacing:-.02em}
.hero h1 em{color:var(--dim)}
.hero p{margin:1.6rem 0 2.2rem;color:var(--dim);font-size:1.08rem}
.btns{display:flex;gap:.8rem;flex-wrap:wrap}
.btn{display:inline-block;padding:.85rem 1.5rem;border-radius:999px;font-weight:600;font-size:.95rem;text-decoration:none;border:1px solid var(--line);transition:background .2s,border-color .2s}
.btn.main{background:var(--blue);border-color:var(--blue);color:var(--ink)}
.btn.main:hover{background:#9bb4ff;border-color:#9bb4ff}
.btn:not(.main):hover{border-color:var(--dim)}
